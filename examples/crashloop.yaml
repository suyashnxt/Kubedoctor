# App that exits because a required env var is missing.
# The most common crashloop I see in real life.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: kd-demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: payments-api}
  template:
    metadata:
      labels: {app: payments-api}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "payments-api starting, version 2.4.1"
              echo "loading config from environment"
              if [ -z "$DATABASE_URL" ]; then
                echo "FATAL: DATABASE_URL is not set, refusing to start" >&2
                exit 1
              fi
              sleep 3600
