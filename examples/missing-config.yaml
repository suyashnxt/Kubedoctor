# References a ConfigMap that was never created.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
  namespace: kd-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: notifications}
  template:
    metadata:
      labels: {app: notifications}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          envFrom:
            - configMapRef:
                name: notifications-settings
